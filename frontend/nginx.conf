server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 해시된 Vite 정적 에셋은 장기 캐시 허용 (파일 미존재 시 index.html 폴백 대신 404 반환)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 프론트엔드 엔트리(index.html) 및 SPA 라우팅 (배포 직후 구버전 index.html 캐시로 인한 백지 현상 방지)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # /api 경로로 오는 요청은 백엔드 컨테이너로 프록시
    location /api/ {
        # Render에 배포된 백엔드 API 주소로 프록시 (Trailing slash 제거하여 /api 경로 유지)
        proxy_pass https://wme-system-backend.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host wme-system-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
