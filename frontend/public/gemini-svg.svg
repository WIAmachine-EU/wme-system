<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 선박 및 컨테이너 라인 -->
  <g fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 선박 하단 선체 (배 모양) -->
    <path d="M 10 50 L 90 50 L 80 75 L 20 75 Z" />
    
    <!-- 선체 내부 가로 라인 디테일 -->
    <line x1="16" y1="58" x2="84" y2="58" />
    <line x1="18" y1="66" x2="82" y2="66" />
    
    <!-- 조타실 하단 층 -->
    <rect x="18" y="35" width="22" height="15" />
    <line x1="18" y1="42" x2="40" y2="42" />
    
    <!-- 조타실 상단 -->
    <rect x="23" y="25" width="12" height="10" />
    
    <!-- 안테나 / 마스트 -->
    <line x1="26" y1="25" x2="26" y2="15" />
    <line x1="32" y1="25" x2="32" y2="18" />

    <!-- 컨테이너 1 (가운데) -->
    <rect x="44" y="38" width="18" height="12" />
    <!-- 컨테이너 1 잠금장치/디테일 -->
    <rect x="49" y="38" width="8" height="6" />

    <!-- 컨테이너 2 (우측) -->
    <rect x="66" y="38" width="18" height="12" />
    <!-- 컨테이너 2 잠금장치/디테일 -->
    <rect x="71" y="38" width="8" height="6" />

  </g>

  <!-- 하단 물결 무늬 (파란색 파도 라인) -->
  <path d="M 10 85 Q 20 78 30 85 T 50 85 T 70 85 T 90 85" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 10 92 Q 20 85 30 92 T 50 92 T 70 92 T 90 92" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>

